<!doctype html>
<html lang="en" class="dark" data-theme="hydra">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hydra Pay</title>
    <script>
      // Apply the saved mode/theme before first paint (no flash). Kept in sync with src/hooks/useTheme.tsx.
      try {
        var s = JSON.parse(localStorage.getItem('hydra-ui') || '{}')
        var themes = ['hydra', 'emerald', 'sunset', 'orchid', 'aqua', 'graphite']
        // Optional ?mode=light|dark|system&theme=<id> in the URL sets (and saves) the appearance.
        var q = new URLSearchParams(location.search)
        if (/^(light|dark|system)$/.test(q.get('mode') || '')) s.mode = q.get('mode')
        if (themes.indexOf(q.get('theme')) >= 0) s.theme = q.get('theme')
        if (q.has('mode') || q.has('theme')) localStorage.setItem('hydra-ui', JSON.stringify(s))
        var mode = s.mode || 'dark'
        var dark = mode === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : mode !== 'light'
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.dataset.theme = themes.indexOf(s.theme) >= 0 ? s.theme : 'hydra'
        root.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/dashboard-Ci0kUMgu.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/ThemeSwitcher-DOObSESz.js">
    <link rel="stylesheet" crossorigin href="/assets/ThemeSwitcher-BArBiEwr.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
